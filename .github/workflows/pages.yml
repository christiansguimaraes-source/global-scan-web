name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/icons _site/vendor
          cp index.html app.js sw.js manifest.webmanifest .nojekyll _site/
          cp vendor/jscanify.js vendor/LICENSE-jspdf _site/vendor/
          for f in icons/*.png.b64; do base64 -d "$f" > "_site/${f%.b64}"; done
          curl -fsSL --retry 3 -o _site/vendor/jspdf.umd.min.js https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js
          curl -fsSL --retry 3 -o _site/vendor/opencv.js https://docs.opencv.org/4.x/opencv.js
          ls -lR _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
